  sections:
    Acerca de mí:
        - "Ingeniero Eléctrico y Electrónico especializado en sistemas de potencia y generación renovable, con particular interés y pasión por proyectos fotovoltaicos y tecnologías de generación limpia. Experiencia en análisis técnico-económico de plantas de generación y microrredes, con sólidos conocimientos en protección, control y operación de sistemas eléctricos."
        - "Con capacidad para el análisis de variables operativas, diagnóstico de fallas en equipos de generación (incluyendo inversores y electrónica de potencia) y desarrollo de soluciones técnicas innovadoras para optimizar procesos. Interés especial en operación y mantenimiento de sistemas de potencia."
        - "Habilidades y características destacadas:
          • Coordinación de sistemas de control, protección y potencia
          • Análisis técnico y proposición de soluciones para optimización operativa
          • Operación y monitoreo de plantas de generación (experiencia en simulaciones en tiempo real HIL)
          • Conocimiento en inversores y electrónica de potencia (como monitor universitario)
          • Implementación de metodologías para mejora continua
          • Disponibilidad para reubicación geográfica"
